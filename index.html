<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursed Descent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ece2ca; --surface: #e2d4b5; --surface-2: #d5c39d; --ink: #2a2018; --muted: #6d5c46; --line: #b8a37b;
  --blut: #a8322b; --heil: #2b836d; --gold: #8f6b12; --fackel: #b8661a; --exp: #514a9e;
  --selten: #2f68b5; --episch: #7a3fb0; --legendaer: #b5620e;
  --schatten: rgba(42, 32, 24, .18);
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --surface: #1d2028; --surface-2: #282c36; --ink: #ece3cc; --muted: #a0978a; --line: #383e4a;
    --blut: #e0554b; --heil: #4cc4a2; --gold: #e5c060; --fackel: #f2a446; --exp: #938cf0;
    --selten: #6aa8f2; --episch: #b98af2; --legendaer: #f3a84a;
    --schatten: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --surface: #1d2028; --surface-2: #282c36; --ink: #ece3cc; --muted: #a0978a; --line: #383e4a;
  --blut: #e0554b; --heil: #4cc4a2; --gold: #e5c060; --fackel: #f2a446; --exp: #938cf0;
  --selten: #6aa8f2; --episch: #b98af2; --legendaer: #f3a84a;
  --schatten: rgba(0, 0, 0, .45); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: radial-gradient(ellipse 70% 45% at 50% -8%, color-mix(in srgb, var(--fackel) 22%, transparent), transparent 70%), var(--bg);
  color: var(--ink); font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.titel { font-family: "IM Fell English SC", "Palatino Linotype", Georgia, serif; font-weight: 400; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fackel); outline-offset: 3px; }
.huelle { max-width: 1140px; margin: 0 auto; padding: 18px 16px 40px; }

/* Kopf */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.kopf h1 { margin: 0; font-size: 1.7rem; letter-spacing: .02em; white-space: nowrap; }
.kopf .ort { color: var(--muted); font-size: .95rem; text-align: right; }
.kopf .ort b { color: var(--ink); }
.thema-knopf { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: .9rem; }

/* Layout */
.raster { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.links { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 880px) { .raster { grid-template-columns: 1fr; } }
.tafel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative; }

/* Gegner */
.gegner-buehne { padding: 24px 22px 20px; text-align: center; border-bottom: 1px solid var(--line);
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--fackel) 14%, transparent), transparent 60%); }
.gegner-buehne.boss { background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--blut) 22%, transparent), transparent 62%); }
.boss-banner { display: none; color: var(--blut); font-size: 1rem; letter-spacing: .08em; margin-bottom: 4px; }
.boss .boss-banner { display: block; }
.siegel { font-size: clamp(80px, 15vw, 124px); line-height: 1; margin: 4px 0 8px; display: inline-block; filter: drop-shadow(0 10px 18px var(--schatten)); user-select: none; }
.gegner-name { margin: 0; font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.1; }
.merkmale { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 4px; }
.chip { font-size: .85rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface); }
.chip.schwach { border-color: var(--heil); color: var(--heil); font-weight: 700; }
.chip.stark { border-color: var(--blut); color: var(--blut); font-weight: 700; }
.absicht { margin: 6px 0 12px; color: var(--muted); font-size: .95rem; min-height: 1.4em; }
.absicht.gefahr { color: var(--blut); font-weight: 700; }

.balken { position: relative; height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.balken > i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.balken .nachzieh { background: color-mix(in srgb, var(--fackel) 70%, transparent); transition-delay: .25s; transition-duration: .7s; }
.balken.leben > i.wert { background: var(--blut); }
.balken.exp { height: 8px; }
.balken.exp > i.wert { background: var(--exp); }
.balken-zeile { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); margin: 6px 2px 0; }
.balken-zeile b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gegner-leben { max-width: 420px; margin: 0 auto; }

/* Spieler */
.spieler { padding: 18px 22px 18px; }
.spieler-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.spieler-kopf h2 { margin: 0; font-size: 1.35rem; }
.spieler-kopf span { color: var(--muted); font-size: .92rem; }
.spieler .balken.leben > i.wert { background: var(--heil); }
.spieler .balken.leben.kritisch > i.wert { background: var(--blut); }
.werte { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 560px) { .werte { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.wert-feld { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; }
.wert-feld small { display: block; color: var(--muted); font-size: .8rem; }
.wert-feld b { font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.wert-feld.gold b { color: var(--gold); }

/* Aktionen */
.aktionen { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.aktionen.zwei { grid-template-columns: 1.6fr 1fr; }
@media (max-width: 560px) { .aktionen { grid-template-columns: 1fr 1fr; } .aktionen .angriff { grid-column: 1 / -1; } }
.knopf { position: relative; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  padding: 12px 14px; font-weight: 700; font-size: 1.05rem; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  transition: transform .08s ease, border-color .15s ease; }
.knopf:hover:not(:disabled) { border-color: var(--fackel); }
.knopf:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.knopf:disabled { opacity: .45; cursor: not-allowed; }
.knopf kbd { font-family: inherit; font-weight: 500; font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.knopf.angriff { background: var(--blut); border-color: var(--blut); color: #fff7ec; }
.knopf.angriff kbd { color: #fff7ecbb; border-color: #fff7ec66; }
.knopf.angriff:hover:not(:disabled) { border-color: var(--ink); }
.knopf.primaer { background: var(--fackel); border-color: var(--fackel); color: #1b130a; }
.knopf .unter { display: block; font-weight: 400; font-size: .82rem; opacity: .85; }
.knopf.klein { padding: 7px 10px; font-size: .92rem; }

/* Lager-Vorschau */
.lager { padding: 24px 22px 18px; text-align: center; border-bottom: 1px solid var(--line); }
.lager h2 { margin: 0 0 4px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
.lager > p { margin: 0 auto 14px; color: var(--muted); max-width: 52ch; }
.vorschau { display: flex; align-items: center; gap: 16px; text-align: left; max-width: 520px; margin: 0 auto;
  border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface-2); }
.vorschau.boss { border-color: var(--blut); }
.vorschau .siegel { font-size: 58px; margin: 0; }
.vorschau h3 { margin: 0; font-size: 1.35rem; }
.vorschau .merkmale { justify-content: flex-start; margin: 6px 0 2px; }
.vorschau small { color: var(--muted); }

/* Inventar */
.inventar { padding: 16px 18px 18px; }
.inventar h2 { margin: 0; font-size: 1.3rem; }
.inv-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.inv-kopf span { color: var(--muted); font-size: .9rem; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slots .feld { min-height: 74px; }
.beutel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .slots, .beutel { grid-template-columns: repeat(3, minmax(0, 1fr)); } .wert-feld b { font-size: 1rem; } }
.unterkopf { margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.unterkopf h3 { margin: 0; font-size: 1.1rem; }
.unterkopf span { color: var(--muted); font-size: .88rem; }
.feld { cursor: pointer; text-align: left; border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; background: var(--surface-2);
  padding: 8px 9px; min-height: 66px; display: flex; flex-direction: column; gap: 2px; font-size: .84rem; line-height: 1.25; }
.feld:hover { border-color: var(--fackel); }
.feld.gewaehlt { outline: 2px solid var(--fackel); outline-offset: 1px; }
.feld .art { color: var(--muted); font-size: .75rem; }
.feld .nm { font-weight: 700; overflow-wrap: anywhere; hyphens: auto; }
.feld { min-width: 0; }
.feld .st { color: var(--muted); }
.feld.leer { cursor: default; opacity: .55; border-style: dashed; border-left-width: 1px; justify-content: center; align-items: center; }
.feld.leer:hover { border-color: var(--line); }
.feld.besser .st::after { content: " ▲"; color: var(--heil); font-weight: 700; }
.s-gewoehnlich { border-left-color: var(--line); }
.s-selten { border-left-color: var(--selten); } .t-selten { color: var(--selten); }
.s-episch { border-left-color: var(--episch); } .t-episch { color: var(--episch); }
.s-legendaer { border-left-color: var(--legendaer); } .t-legendaer { color: var(--legendaer); }
.t-gewoehnlich { color: var(--muted); }

.details { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
.details h4 { margin: 0; font-size: 1.15rem; }
.details .zeile { color: var(--muted); font-size: .88rem; margin: 2px 0 8px; }
.details ul { margin: 0 0 10px; padding-left: 18px; }
.details li { font-size: .93rem; }
.details .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
.delta { font-size: .9rem; margin: 0 0 10px; }
.delta .plus { color: var(--heil); font-weight: 700; }
.delta .minus { color: var(--blut); font-weight: 700; }
.leer-hinweis { color: var(--muted); font-size: .92rem; margin: 10px 0 0; }
.kampfwerte { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .88rem; color: var(--muted); }
.kampfwerte b { color: var(--ink); }

/* Chronik */
.chronik { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 16px 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.chronik h2 { margin: 0 0 8px; font-size: 1.25rem; }
.chronik ol { list-style: none; margin: 0; padding: 0; max-height: 560px; overflow-y: auto; }
@media (max-width: 880px) { .chronik { position: static; } .chronik ol { max-height: 240px; } }
.chronik li { padding: 6px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.chronik li:first-child { border-top: 0; }
.chronik li.schaden { color: var(--blut); } .chronik li.heil { color: var(--heil); } .chronik li.gold { color: var(--gold); }
.chronik li.level { color: var(--exp); font-weight: 700; } .chronik li.raum { color: var(--muted); font-weight: 700; padding-top: 10px; }

/* Effekte */
.zahl { position: fixed; pointer-events: none; font-weight: 800; font-size: 1.7rem; text-shadow: 0 2px 6px var(--schatten); animation: aufsteigen .95s ease-out forwards; z-index: 60; white-space: nowrap; }
.zahl.treffer { color: var(--blut); } .zahl.heilung { color: var(--heil); } .zahl.krit { font-size: 2.3rem; } .zahl.info { color: var(--fackel); font-size: 1.15rem; }
@keyframes aufsteigen { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }
.wackeln { animation: wackeln .35s ease; }
@keyframes wackeln { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-3deg); } 45% { transform: translateX(8px) rotate(2deg); } 70% { transform: translateX(-4px); } }
.erscheinen { animation: erscheinen .5s cubic-bezier(.2,.8,.2,1); }
@keyframes erscheinen { from { opacity: 0; transform: scale(.6) translateY(16px); } to { opacity: 1; transform: none; } }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; box-shadow: inset 0 0 160px 40px color-mix(in srgb, var(--blut) 75%, transparent); }
.vignette.an { animation: vignette .5s ease; }
@keyframes vignette { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

/* Dialoge */
.schleier { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 20px;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); }
.schleier.offen { display: flex; }
.dialog { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 60px var(--schatten);
  padding: 22px 22px 18px; animation: erscheinen .3s cubic-bezier(.2,.8,.2,1); max-height: calc(100% - 20px); overflow-y: auto; }
.dialog h2 { margin: 0 0 4px; font-size: 1.6rem; line-height: 1.15; }
.dialog > p { margin: 6px 0 12px; color: var(--muted); }
.dialog .knoepfe { display: grid; gap: 8px; margin-top: 14px; }
.dialog .details { margin-top: 6px; }
.verkauf { display: grid; gap: 6px; margin-top: 8px; }
.verkauf .knopf { font-weight: 500; }

/* Start/Ende */
.buehne-voll { text-align: center; padding: 40px 22px 32px; }
.buehne-voll .siegel { font-size: 104px; }
.buehne-voll h2 { font-size: clamp(2rem, 6vw, 3rem); margin: 4px 0 6px; line-height: 1.05; }
.buehne-voll > p { color: var(--muted); max-width: 48ch; margin: 0 auto 18px; }
.buehne-voll .knopf { display: inline-flex; justify-content: center; min-width: 240px; }
.anleitung { text-align: left; max-width: 460px; margin: 0 auto 22px; padding: 0; list-style: none; }
.anleitung li { padding: 6px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.anleitung li:first-child { border-top: 0; }
.rekord { color: var(--gold); font-weight: 700; margin-top: 16px; }
.statistik { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 460px; margin: 0 auto 20px; }
.statistik div { border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.statistik small { display: block; color: var(--muted); font-size: .8rem; }
.statistik b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.eintragen { max-width: 460px; margin: 0 auto 20px; display: grid; gap: 6px; text-align: left; }
.eintragen label { color: var(--muted); font-size: .9rem; }
.eintragen div { display: flex; gap: 8px; }
.eintragen input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.eintragen input:focus-visible { outline-offset: 1px; }
.eintragen small { color: var(--muted); min-height: 1.2em; }
.buehne-voll .eintragen .knopf { min-width: 0; }

/* Rangliste */
.unter-reiter { margin-top: -6px; }
.unter-reiter button { font-weight: 500; padding: 4px 12px; font-size: .92rem; }
.rangliste { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 6px; max-width: 620px; }
.rangliste li { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--surface-2); }
.rangliste li.ich { border-color: var(--fackel); box-shadow: inset 3px 0 0 var(--fackel); }
.rangliste .platz { width: 2ch; text-align: right; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.rangliste li:nth-child(1) .platz { color: var(--gold); }
.rangliste .wer { flex: 1; min-width: 0; display: grid; }
.rangliste .wer b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rangliste .wer small { color: var(--muted); font-size: .84rem; }
.rangliste .raum { color: var(--muted); white-space: nowrap; }
.rangliste .raum b { color: var(--ink); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.hinweis { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 500; z-index: 70; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.hinweis.an { opacity: 1; }
@media (max-width: 560px) { .kopf h1 { font-size: 1.35rem; } .kopf .ort { font-size: .85rem; } .knopf kbd { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
:root { --set: #1f8a5a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --set: #49d18f; } }
:root[data-theme="dark"] { --set: #49d18f; }
.s-set { border-left-color: var(--set); } .t-set { color: var(--set); }
.chip.elite { border-color: var(--legendaer); color: var(--legendaer); font-weight: 700; }
.chip.segen { border-color: var(--exp); color: var(--exp); }

/* Hub */
.hub { padding: 26px 22px 24px; }
.hub-kopf { text-align: center; margin-bottom: 16px; }
.hub-kopf h2 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.05; }
.hub-kopf p { margin: 6px auto 0; color: var(--muted); max-width: 52ch; }
.splitter { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 10px; font-size: 1.05rem; }
.splitter b { color: var(--exp); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.reiter { display: flex; gap: 6px; justify-content: center; margin: 14px 0 18px; flex-wrap: wrap; }
.reiter button { cursor: pointer; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 16px; font-weight: 700; color: var(--muted); }
.reiter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.abschnitt-titel { margin: 18px 0 8px; font-size: 1.15rem; }
.karten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .karten { grid-template-columns: 1fr; } }
.karte { cursor: pointer; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 12px 14px; display: grid; gap: 4px; }
.karte:hover:not(:disabled) { border-color: var(--fackel); }
.karte[aria-pressed="true"] { outline: 2px solid var(--fackel); outline-offset: 1px; }
.karte .gross { font-size: 2.2rem; line-height: 1; }
.karte b { font-size: 1.1rem; }
.karte small { color: var(--muted); font-size: .86rem; line-height: 1.35; }
.karte.gesperrt { opacity: .75; }
.fluch { display: flex; flex-wrap: wrap; gap: 6px; }
.fluch button { cursor: pointer; min-width: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 6px 10px; font-weight: 700; }
.fluch button[aria-pressed="true"] { background: var(--blut); color: #fff7ec; border-color: var(--blut); }
.fluch button:disabled { opacity: .35; cursor: not-allowed; }
.fluch-text { color: var(--muted); font-size: .9rem; margin: 6px 0 0; }
.start-zeile { margin-top: 20px; text-align: center; }
.start-zeile .knopf { display: inline-flex; min-width: 260px; justify-content: center; }
.baum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .baum { grid-template-columns: 1fr; } }
.ast { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface-2); display: grid; gap: 8px; align-content: start; }
.ast h3 { margin: 0; font-size: 1.2rem; }
.ast > small { color: var(--muted); }
.knoten { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 9px 10px; display: grid; gap: 4px; }
.knoten.schluessel { border-color: var(--exp); border-width: 2px; }
.knoten b { font-size: .98rem; }
.knoten small { color: var(--muted); font-size: .84rem; line-height: 1.3; }
.knoten .zeile2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.punkte { display: flex; gap: 3px; }
.punkte { flex-wrap: wrap; max-width: 140px; }
.punkte i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--exp); }
.punkte i.voll { background: var(--exp); }
.erfolge { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.erfolge li { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--surface-2); }
.erfolge li.erreicht { border-color: var(--heil); }
.erfolge li span { color: var(--muted); font-size: .88rem; }
.erfolge li.erreicht b::before { content: "✓ "; color: var(--heil); }
.erfolge li { align-items: center; }
.erfolge li span.lohn { color: var(--exp); }
.lohn { color: var(--exp); font-weight: 700; white-space: nowrap; }
.karte .lohn { white-space: normal; }
.segen-liste, .set-liste { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.set-liste .chip { border-color: var(--set); color: var(--set); }
.ereignis { padding: 26px 22px 20px; text-align: center; border-bottom: 1px solid var(--line); }
.ereignis h2 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
.ereignis p { margin: 0 auto 6px; color: var(--muted); max-width: 52ch; }
.belohnung-splitter { font-size: 1.2rem; margin: 0 0 16px; }
.belohnung-splitter b { color: var(--exp); font-size: 1.8rem; }

.fortsetzen { border: 1px solid var(--fackel); border-radius: 8px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.fortsetzen small { color: var(--muted); display: block; }
.fortsetzen .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }
.sortierung { display: flex; gap: 4px; flex-wrap: wrap; }
.sortierung button { cursor: pointer; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.sortierung button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.unterkopf h3 span { color: var(--muted); font-size: .85rem; font-family: "Alegreya Sans", sans-serif; margin-left: 6px; }
button.chip { cursor: pointer; font: inherit; font-size: .85rem; }
.set-boni { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.set-boni li { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--muted); }
.set-boni li.aktiv { border-color: var(--set); color: var(--ink); }
.set-boni li.aktiv::before { content: "✓ "; color: var(--set); font-weight: 700; }

function seltenheitsGewichte(raum, boss) {
  if (boss) return [0, 50, 35 + 0.5 * raum, 10 + 0.3 * raum];
  return [Math.max(70 - 0.5 * raum, 20), 22 + 0.5 * raum, 6 + 0.3 * raum, 2 + 0.1 * raum];
}
function seltenheitWuerfeln(raum, boss) {
  const g = seltenheitsGewichte(raum, boss);
  let r = rnd() * g.reduce((a, b) => a + b, 0), i = 0;
  while (i < 3 && r > g[i]) { r -= g[i]; i++; }
  return i;
}

function effektErzeugen(typ, stufe) {
  switch (typ) {
    case "krit": return { typ, wert: 4 + stufe + zufall(0, 4) };
    case "lebensraub": return { typ, wert: 5 + stufe + zufall(0, 4) };
    case "angriff": return { typ, wert: 1 + stufe + zufall(0, 2) };
    case "schutz": return { typ, wert: 1 + Math.ceil(stufe * 0.8) + zufall(0, 1) };
    case "block": return { typ, wert: 8 + zufall(0, 7) };
    case "dornen": return { typ, wert: 2 + 2 * stufe + zufall(0, 2) };
    case "leben": return { typ, wert: 8 + 6 * stufe + zufall(0, 5) };
    case "resistenz": return { typ, wert: 20 + zufall(0, 15), element: wahl(ELEMENT_KEYS) };
  }
}

function gegenstandBauen(slot, selIndex, stufe, setKey = null) {
  const sel = SELTENHEIT[selIndex];
  const basisListe = BASIS[slot];
  const tier = zufall(0, Math.min(basisListe.length - 1, stufe));
  const it = { id: ++idZaehler, slot, seltenheit: setKey ? "set" : sel.key, set: setKey, stufe, angriff: 0, schutz: 0, element: null, effekte: [] };
  const sw = SLOT_WERTE[slot];
  if (sw) {
    const [b, ps, pb] = sw.werte;
    it[sw.art] = Math.max(1, Math.round((b + ps * stufe + pb * tier) * sel.mult));
  }
  if (slot === "waffe") {
    if (setKey === "glut") it.element = "feuer";
    else if (!setKey && rnd() < 0.35 + 0.15 * selIndex) it.element = wahl(ELEMENT_KEYS);
  }
  const pool = [...EFFEKT_POOL[slot]];
  if (setKey) {
    const fest = SETS[setKey].effekt;
    it.effekte.push(effektErzeugen(fest, stufe));
    const i = pool.indexOf(fest); if (i >= 0) pool.splice(i, 1);
  }
  const anzahl = sel.effekte + (sw ? 0 : 1) - (setKey ? 1 : 0);
  for (let i = 0; i < anzahl && pool.length; i++) it.effekte.push(effektErzeugen(pool.splice(zufall(0, pool.length - 1), 1)[0], stufe));

  const basis = basisListe[tier];
  if (setKey) it.name = `${SETS[setKey].name}-${basis}`;
  else {
    const vor = it.element ? ELEMENTE[it.element].vor + "-" : "";
    it.name = vor + basis + (it.effekte.length ? " " + NAMEN_ZUSATZ[it.effekte[0].typ] : "");
  }
  it.wert = Math.round((10 + 8 * stufe) * (setKey ? 5 : sel.wert));
  return it;
}

function gegenstandErzeugen(raum, quelle = "normal") {
  const it = gegenstandWuerfeln(raum, quelle);
  if (it.set) statPlus("setteile");
  if (it.seltenheit === "legendaer") statPlus("legendaer");
  return it;
}

function gegenstandWuerfeln(raum, quelle) {
  const stufe = Math.floor(raum / 5) + 1;

  if (rnd() < setChance) {

    return gegenstandBauen(wahl(SETS[setKey].slots), 2, stufe, setKey);
  }
  const it = gegenstandBauen(wahl(SLOTS).key, seltenheitWuerfeln(raum, quelle !== "normal"), stufe);

}

function effektText(e) {

function setZaehlen(ausr = s.ausr) {

const setStufe = (zahl, key) => Math.floor((zahl[key] || 0) / 2); // 0..3 aktive Boni

function werte(ausr = s.ausr) {
  const w = { angriff: s.angriffBasis + 2 * skill("kraft"), schutz: 0, maxLeben: s.maxLebenBasis + 10 * skill("zaehigkeit"),
    krit: 5 + skill("praezision") + (s.klasse === "schurke" ? 12 : 0), lebensraub: 0, dornen: 0, block: 0, res: {}, element: null,

  if (setStufe(z, "frost") >= 1) w.block += 15;
  if (setStufe(z, "frost") >= 2) { w.res.eis += 20; w.schutz = Math.round(w.schutz * 1.25); }
  if (setStufe(z, "blut") >= 1) w.lebensraub += 8;
  if (setStufe(z, "schatten") >= 1) w.krit += 10;
  if (setStufe(z, "schatten") >= 2) w.kritMult = 2.25;
  if (setStufe(z, "dorn") >= 1) w.dornen = Math.round(w.dornen * 1.5);
  if (setStufe(z, "dorn") >= 2) w.schutz = Math.round(w.schutz * 1.25);

  if (hatSegen("blutpakt")) w.lebensraub += 20;
  if (hatSegen("glaskanone")) { w.angriff = Math.round(w.angriff * 1.4); w.maxLeben = Math.round(w.maxLeben * 0.7); }
  if (hatSegen("berserker")) w.schutz = Math.round(w.schutz * 0.5);
  if (hatSegen("eisenhaut")) { w.schutz = Math.round(w.schutz * 1.6); w.angriff = Math.round(w.angriff * 0.8); }
  if (hatSegen("elementbund")) { w.schwachF = 2.2; w.starkF = 0.2; }
  if (hatSegen("wagemut")) w.krit += 25;
  if (hatSegen("opfer")) w.maxLeben = Math.round(w.maxLeben * 0.85);

  w.block = hatSegen("wagemut") ? 0 : Math.min(w.block, 45);

  feld("Angriff", alt.angriff, neu.angriff); feld("Schutz", alt.schutz, neu.schutz); feld("Max-Leben", alt.maxLeben, neu.maxLeben);
  feld("Krit", alt.krit, neu.krit, " %"); feld("Lebensraub", alt.lebensraub, neu.lebensraub, " %");
  feld("Block", alt.block, neu.block, " %"); feld("Dornen", alt.dornen, neu.dornen);
  ELEMENT_KEYS.forEach((k) => feld(`${ELEMENTE[k].icon}-Resistenz`, alt.res[k], neu.res[k], " %"));
  if (alt.element !== neu.element) teile.push(`Element: ${neu.element ? elText(neu.element) : "keins"}`);

function gegnerErzeugen(raum) {
  if (s.tages) rnd = mulberry32(s.seed + raum * 7919);
  const k = 1 + 0.025 * raum + 0.0006 * raum * raum;
  const kl = (1 + 0.15 * s.fluch) * (hatSegen("seelenernte") ? 1.2 : 1);
  const ks = (1 + 0.1 * s.fluch) * (hatSegen("gier") ? 1.25 : 1);
  if (raum % 5 === 0) {
    const stufe = Math.floor(raum / 5);
    const b = wahl(BOSSE.filter((x) => x.ab <= stufe));
    return { ...b, art: b.name, mechanik: BOSS_MECHANIK[b.name], boss: true, stufe, elite: null, leben: Math.round((120 + 85 * (stufe - 1)) * k * kl),
      schaden: Math.round((14 + 7 * (stufe - 1)) * k * ks), spezial: Math.round((24 + 10 * (stufe - 1)) * k * ks), exp: 100 * stufe, gold: 0 };
  }
  if (raum > 2 && rnd() < 0.15) return { ereignis: wahl(["schrein", "truhe", "brunnen", "spieltisch"]) };
  const g = wahl(GEGNER.filter((x) => x.ab <= raum));
  const gegner = { ...g, art: g.name, element: null, boss: false, stufe: 0, elite: null, leben: Math.round((22 + 7 * raum) * k * kl),
    schaden: Math.round((4 + 2 * raum) * k * ks), spezial: 0, exp: 10 * raum, gold: zufall(4, 10) + raum };
  if (raum >= 3 && rnd() < 0.15) {
    const e = wahl(ELITE);
    gegner.elite = e.key;
    gegner.name = `${g.name} (${e.name})`;
    if (e.key === "zaeh") gegner.leben = Math.round(gegner.leben * 1.8);
    if (e.key === "wuetend") gegner.schaden = Math.round(gegner.schaden * 1.4);
    gegner.exp *= 2; gegner.gold *= 2;
  }
  return gegner;
}

function betreteRaum() {
  s.raum = s.ziel;
  erfolgePruefen();
  if (s.naechster.ereignis) { s.phase = "ereignis"; zeichneEreignis(s.naechster.ereignis); zeichneInventar(); return; }
  s.gegner = s.naechster;
  s.gegner.maxLeben = s.gegner.leben;
  s.runde = 0; s.ersterAngriff = true; s.brand = 0; s.trankImKampf = false; s.gift = 0; s.brennen = 0;
  s.phase = "kampf";
  eintrag(`Raum ${s.raum}: ${s.gegner.boss ? "Boss " : s.gegner.elite ? "Elite " : ""}${s.gegner.name} erscheint`, "raum");
  zeichneKampf(true);
  zeichneInventar();
}

function zumLager(titel, text) {
  s.phase = "lager";
  s.naechster = gegnerErzeugen(s.ziel);
  zeichneLager(titel, text);
  zeichneInventar();
  laufSpeichern();
}

function elementFaktor(g, element, w = werte()) {
  if (!element) return 1;
  if (element === g.schwach) return w.schwachF;
  if (element === g.stark) return w.starkF;
  return 1;
}
function schutzAnteil(schutz) { return schutz / (schutz + 15 + 3 * (s.phase === "lager" ? s.ziel : s.raum)); }
function trefferVorschau(g, spezial) {
  const w = werte();
  let roh = spezial ? g.spezial : g.schaden;
  if (g.element) roh *= 1 - w.res[g.element] / 100;
  roh *= 1 - schutzAnteil(g.mechanik === "leere" ? w.schutz / 2 : w.schutz);
  return Math.max(Math.round(roh), 1);
}
function schadenSpanne(g) {
  const w = werte();
  let f = 1;
  if (w.element) f = elementFaktor(g, w.element, w) * w.elementMult;
  if (hatSegen("berserker")) f *= 1 + 0.05 * Math.floor((1 - s.leben / w.maxLeben) * 10);
  if (g.elite === "gepanzert") f *= 0.7;
  if (g.mechanik === "knochenpanzer" && g.leben < g.maxLeben / 2) f *= 0.7;
  return [Math.max(1, Math.round(w.angriff * f)), Math.round((w.angriff + 5) * f)];
}

// =====================================================================
//   KAMPF
// =====================================================================
function aktion(typ) {
  if (beschaeftigt || s.phase !== "kampf") return;
  const g = s.gegner;
  const w = werte();

  if (typ === "angriff") {
    let f = 1;
    if (w.element) f = elementFaktor(g, w.element, w) * w.elementMult;
    if (hatSegen("berserker")) f *= 1 + 0.05 * Math.floor((1 - s.leben / w.maxLeben) * 10);
    if (g.elite === "gepanzert") f *= 0.7;
    if (g.mechanik === "knochenpanzer" && g.leben < g.maxLeben / 2) f *= 0.7;
    if (g.mechanik === "blendung" && rnd() < 0.2) {
      s.ersterAngriff = false;
      zahl($("gegnerName"), "Verfehlt", "info");
      eintrag(`Geblendet! Dein Angriff verfehlt ${g.name}.`);
      nachSpielerZug();
      return;
    }
    const krit = (s.ersterAngriff && skill("erstschlag")) || rnd() * 100 < w.krit;
    s.ersterAngriff = false;
    let schaden = Math.max(1, Math.round((w.angriff + zufall(0, 5)) * f * (krit ? w.kritMult : 1)));
    g.leben = Math.max(g.leben - schaden, 0);
    zahl($("siegel"), `−${schaden}`, "treffer" + (krit ? " krit" : ""));
    const ef = w.element ? elementFaktor(g, w.element, w) : 1;
    if (ef > 1) zahl($("gegnerName"), "Schwachstelle!", "info");
    if (ef < 1) zahl($("gegnerName"), "Resistent", "info");
    wackle($("siegel"));
    eintrag(`${krit ? "Kritisch! " : ""}Du triffst ${g.name} für ${schaden}${ef > 1 ? " (Schwachstelle)" : ef < 1 ? " (resistent)" : ""}.`);

    ton(krit ? "krit" : "treffer");
    if (g.mechanik === "hoellenpakt") {
      const rueck = Math.max(1, Math.round(schaden * 0.15));
      s.leben = Math.max(s.leben - rueck, 1);
      eintrag(`Höllenpakt: ${rueck} Schaden trifft dich selbst.`, "schaden");
    }
    if (krit && setStufe(w.z, "schatten") >= 3 && g.leben > 0) {
      const zweit = Math.max(1, Math.round(schaden / 2));
      g.leben = Math.max(g.leben - zweit, 0); schaden += zweit;
      eintrag(`Schattenstoß: weitere ${zweit} Schaden.`);
    }
    if (setStufe(w.z, "glut") >= 3 && g.leben > 0) s.brand = 3;

    let lr = w.lebensraub;
    if (setStufe(w.z, "blut") >= 2 && s.leben < w.maxLeben * 0.3) lr *= 2;
    if (lr && s.leben < w.maxLeben) {
      const heil = Math.min(Math.max(1, Math.round(schaden * lr / 100)), w.maxLeben - s.leben);
      s.leben += heil;
      zahl($("spielerBalken"), `+${heil}`, "heilung");
    }
  } else if (typ === "trank") {
    if (!trankTrinken()) return;
    s.trankImKampf = true;
  } else if (typ === "flucht") {
    if (g.boss) {
      s.ziel = Math.max(s.raum - 3, 1);
      eintrag(`Du fliehst vor ${g.name} zurück in Raum ${s.ziel}.`, "schaden");
      zumLager("Geflohen", "Du bist dem Boss entkommen. Sammle Kraft und Ausrüstung, dann versuch es erneut.");
    } else {
      eintrag(`Du fliehst vor ${g.name}.`);
      spielende("Geflohen");
    }
    return;
  }
  nachSpielerZug();
}

function trankHeilung(w) {
  let anteil = 0.4 + 0.02 * skill("heilkunde");
  if (hatSegen("alchemist")) anteil *= 2;
  return Math.min(Math.floor(w.maxLeben * anteil), w.maxLeben - s.leben);
}

function trankTrinken() {
  const w = werte();
  if (hatSegen("blutpakt")) { hinweis("Blutpakt: Tränke wirken nicht mehr"); return false; }
  if (s.traenke === 0) { hinweis("Keine Tränke mehr"); return false; }
  if (s.leben >= w.maxLeben) { hinweis("Dein Leben ist voll"); return false; }
  s.traenke -= 1;
  const heil = trankHeilung(w);
  s.leben += heil;
  zahl($("spielerBalken"), `+${heil}`, "heilung");
  eintrag(`Du trinkst einen Trank: +${heil} Leben.`, "heil");
  return true;
}

function nachSpielerZug() {
  aktualisiere(); zeichneInventar();
  if (s.gegner.leben === 0) { beschaeftigt = true; setTimeout(() => { beschaeftigt = false; sieg(); }, 520); return; }
  beschaeftigt = true; aktualisiere();
  setTimeout(gegnerZug, 430);
}

function einTreffer(g, spezial, w) {
  let treffer = trefferVorschau(g, spezial);
  if (g.mechanik === "tentakel") treffer = Math.max(1, Math.round(treffer * 0.6));
  s.trefferZaehler += 1;
  if (setStufe(w.z, "frost") >= 3 && s.trefferZaehler % 4 === 0) {
    zahl($("spielerZahl"), "Abgewehrt", "info");
    eintrag(`Frostwacht wehrt den Treffer von ${g.name} komplett ab.`, "heil");
    return;
  }
  const geblockt = rnd() * 100 < w.block;
  if (geblockt) treffer = Math.ceil(treffer / 2);
  s.leben = Math.max(s.leben - treffer, 0);
  ton("schaden");
  if (g.mechanik === "gift") s.gift = 3;
  if (g.mechanik === "feueratem" && spezial) { s.brennen = 3; eintrag("Du stehst in Flammen!", "schaden"); }
  if (g.mechanik === "lebensentzug") {
    const heil = Math.min(Math.round(treffer * 0.3), g.maxLeben - g.leben);
    if (heil > 0) { g.leben += heil; eintrag(`${g.name} entzieht dir ${heil} Leben.`); }
  }
  zahl($("spielerBalken"), `−${treffer}`, "treffer" + (spezial ? " krit" : ""));
  if (geblockt) zahl($("spielerZahl"), "Geblockt", "info");
  eintrag(spezial ? `${g.name} entfesselt einen Spezialangriff${g.element ? " " + ELEMENTE[g.element].icon : ""}: −${treffer}!` : `${g.name} trifft dich für ${treffer}${geblockt ? " (geblockt)" : ""}.`, "schaden");
  if (g.elite === "vampir") {
    const heil = Math.min(Math.round(treffer / 2), g.maxLeben - g.leben);
    if (heil > 0) { g.leben += heil; eintrag(`${g.name} heilt sich um ${heil}.`); }
  }
  if (w.dornen && g.leben > 0) { g.leben = Math.max(g.leben - w.dornen, 0); eintrag(`Dornen: ${g.name} erleidet ${w.dornen}.`); }
  if (setStufe(w.z, "dorn") >= 3 && g.leben > 0) {
    const verlust = Math.max(1, Math.round(g.maxLeben * 0.05));
    g.leben = Math.max(g.leben - verlust, 0); eintrag(`Dornenkönig: ${g.name} verliert ${verlust}.`);
  }
}

function gegnerZug() {
  const g = s.gegner;
  const w = werte();
  if (s.gift > 0) { const d = Math.max(1, Math.round(w.maxLeben * 0.04)); s.leben = Math.max(s.leben - d, 0); s.gift -= 1; eintrag(`Gift: −${d}.`, "schaden"); }
  if (s.brennen > 0) { const d = Math.max(1, Math.round(w.maxLeben * 0.03)); s.leben = Math.max(s.leben - d, 0); s.brennen -= 1; eintrag(`Du brennst: −${d}.`, "schaden"); }
  if (s.brand > 0 && g.leben > 0) {
    const brand = Math.max(1, Math.round(w.angriff * 0.3));
    g.leben = Math.max(g.leben - brand, 0); s.brand -= 1;
    zahl($("siegel"), `🔥 −${brand}`, "treffer"); eintrag(`${g.name} brennt: −${brand}.`);
  }
  if (g.leben > 0) {
    s.runde += 1;
    const spezial = g.boss && s.runde % 3 === 0;
    let anzahl = g.elite === "flink" || g.mechanik === "tentakel" ? 2 : 1;
    if (g.mechanik === "sturmflug" && rnd() < 0.25) { anzahl += 1; eintrag(`${g.name} stößt blitzschnell nach!`); }
    for (let i = 0; i < anzahl && s.leben > 0 && g.leben > 0; i++) einTreffer(g, spezial && i === 0, w);
    if (spezial && g.mechanik === "eiseskaelte" && s.leben > 0 && g.leben > 0) { eintrag(`Eiseskälte: ${g.name} schlägt sofort noch einmal zu.`, "schaden"); einTreffer(g, false, w); }
    if (g.mechanik === "verstaerkung" && s.runde % 4 === 0) {
      g.schaden = Math.round(g.schaden * 1.15); g.spezial = Math.round(g.spezial * 1.15);
      eintrag(`${g.name} ruft Verstärkung: Er wird stärker!`, "schaden");
    }
    if (g.mechanik === "raserei" && !g.rasend && g.leben < g.maxLeben * 0.3) {
      g.rasend = true; g.schaden = Math.round(g.schaden * 1.5); g.spezial = Math.round(g.spezial * 1.5);
      eintrag(`${g.name} gerät in Raserei!`, "schaden");
    }
    const v = $("vignette"); v.classList.remove("an"); void v.offsetWidth; v.classList.add("an");
  }

  if (s.leben === 0 && skill("zweitesleben") && !s.zweitesLebenGenutzt) {
    s.zweitesLebenGenutzt = true;
    s.leben = Math.round(werte().maxLeben * 0.3);
    eintrag("Zweites Leben: Du stehst noch einmal auf!", "level");
    zahl($("spielerBalken"), "Zweites Leben", "info");
  }
  aktualisiere();
  if (s.leben === 0) { setTimeout(() => { beschaeftigt = false; spielende("Niederlage"); }, 600); return; }
  if (g.leben === 0) { setTimeout(() => { beschaeftigt = false; sieg(); }, 520); return; }
  setTimeout(() => { beschaeftigt = false; aktualisiere(); zeichneInventar(); }, 250);
}

// ---------- Ausrüsten ----------
function anlegen(id) {
  if (beschaeftigt) return;
  const idx = s.beutel.findIndex((x) => x.id === id);
  if (idx < 0) return;
  const it = s.beutel[idx], alt = s.ausr[it.slot];
  s.beutel.splice(idx, 1);
  if (alt) s.beutel.push(alt);
  s.ausr[it.slot] = it;
  s.leben = Math.min(s.leben, werte().maxLeben);
  s.auswahl = { ort: "slot", slot: it.slot };
  eintrag(`${it.name} angelegt.`, "gold");
  erfolgePruefen();
  nachWechsel();
}
function ablegen(slot) {
  if (beschaeftigt) return;
  const it = s.ausr[slot];
  if (!it) return;
  if (s.beutel.length >= BEUTEL_PLAETZE) { hinweis("Dein Beutel ist voll"); return; }
  s.ausr[slot] = null; s.beutel.push(it);
  s.leben = Math.min(s.leben, werte().maxLeben);
  s.auswahl = { ort: "beutel", id: it.id };
  eintrag(`${it.name} abgelegt.`);
  nachWechsel();
}
function wegwerfen(id) {
  const idx = s.beutel.findIndex((x) => x.id === id);
  if (idx < 0) return;
  eintrag(`${s.beutel[idx].name} weggeworfen.`);
  s.beutel.splice(idx, 1); s.auswahl = null; zeichneInventar();
}
function nachWechsel() {
  if (s.phase === "kampf") {
    eintrag("Der Wechsel kostet dich deinen Zug.");
    beschaeftigt = true; aktualisiere(); zeichneInventar();
    setTimeout(gegnerZug, 430);
  } else {
    if (s.phase === "lager") { aktualisiereLager(); laufSpeichern(); }
    zeichneInventar();
  }
}

// =====================================================================
//   NACH DEM SIEG
// =====================================================================
function sieg() {
  const g = s.gegner;
  if (s.tages) rnd = mulberry32(s.seed + s.raum * 104729);
  bestiariumEintrag(g);
  ton("sieg");
  const w0 = werte();
  s.phase = "nachKampf";
  const goldFaktor = hatSegen("gier") ? 2 : 1;
  s.exp += g.exp; s.gold += g.gold * goldFaktor;
  statPlus("monster"); if (g.gold) statPlus("gold", g.gold * goldFaktor);
  if (g.elite) { s.elite += 1; statPlus("elite"); }
  eintrag(`${g.name} besiegt: +${g.exp} EXP${g.gold ? `, +${g.gold * goldFaktor} Gold` : ""}.`, "gold");

  if (setStufe(w0.z, "blut") >= 3) {
    const heil = Math.min(Math.round(w0.maxLeben * 0.15), w0.maxLeben - s.leben);
    if (heil > 0) { s.leben += heil; eintrag(`Blutjäger: +${heil} Leben.`, "heil"); }
  }

  const levelVorher = s.level;
  while (s.exp >= 50 * s.level) {
    s.exp -= 50 * s.level; s.level += 1; s.maxLebenBasis += 10; s.angriffBasis += 3;
    eintrag(`Level ${s.level}! Max-Leben +10, Angriff +3.`, "level"); ton("level");
  }
  if (s.level > levelVorher) s.leben = werte().maxLeben;

  const keineTraenke = hatSegen("alchemist");
  const dropBonus = 0.015 * skill("spuersinn");
  let fund = null;
  if (g.boss) {
    s.bosse += 1;
    statPlus("bosse");
    if (!s.trankImKampf) statPlus("ohneTrank");
    statMax("fluch", s.fluch);
    const gold = 40 * g.stufe * goldFaktor; s.gold += gold; statPlus("gold", gold);
    eintrag(`Boss-Kiste: ${gold} Gold.`, "gold");
    if (!keineTraenke && rnd() < 0.5 && s.traenke < maxTraenke()) { s.traenke += 1; eintrag("Ein Trank liegt in der Kiste.", "heil"); }
    fund = gegenstandErzeugen(s.raum, "boss");
  } else {
    if (!keineTraenke && rnd() < 0.2 && s.traenke < maxTraenke()) { s.traenke += 1; eintrag("Du findest einen Trank.", "heil"); }
    const chance = (g.elite ? 0.6 : 0.2 + dropBonus) * (hatSegen("gier") ? 2 : 1);
    if (rnd() < chance) fund = gegenstandErzeugen(s.raum, g.elite ? "elite" : "normal");
  }
  erfolgePruefen();
  aktualisiere(); zeichneInventar();

  const schritte = [];
  if (s.level > levelVorher) schritte.push((weiter) => dialog({
    titel: `Level ${s.level}`, text: "Max-Leben +10, Angriff +3. Dein Leben ist voll aufgefüllt.",
    knoepfe: [{ text: "Weiter", primaer: true, tun: weiter }]
  }));
  if (fund) schritte.push((weiter) => fundDialog(fund, weiter));
  if (g.boss) {
    schritte.push((weiter) => segenDialog(weiter));
    schritte.push((weiter) => dialog({
      titel: "Der Boss ist gefallen",
      text: "Unter dir wartet ein stärkerer Boss. Gehst du tiefer oder kehrst du mit deiner Beute heim?",
      knoepfe: [{ text: "Tiefer hinab", primaer: true, tun: weiter }, { text: "Mit Ruhm heimkehren", tun: () => spielende("Sieg") }]
    }));
  } else {
    const r = rnd();
    if (r < 0.3) schritte.push((weiter) => haendler(weiter));
    else if (r < 0.45) schritte.push((weiter) => schmied(weiter));
  }

  const naechster = () => {
    const schritt = schritte.shift();
    if (schritt) schritt(naechster);
    else { schliesseDialog(); s.ziel = s.raum + 1; zumLager(`Raum ${s.raum} geräumt`, "Bereite dich vor. Im Kampf kostet jeder Ausrüstungswechsel deinen Zug."); }
  };
  naechster();
}

function segenDialog(weiter) {
  const frei = SEGEN.filter((x) => !s.segen.includes(x.key));
  if (!frei.length) { weiter(); return; }
  const auswahl = [];
  while (auswahl.length < Math.min(3, frei.length)) {
    const x = wahl(frei);
    if (!auswahl.includes(x)) auswahl.push(x);
  }
  dialog({
    titel: "Ein Segen der Tiefe",
    text: "Aus dem gefallenen Boss steigt eine Macht auf. Jeder Segen ist stark, verlangt aber einen Preis bis zum Ende des Laufs.",
    knoepfe: [
      ...auswahl.map((x) => ({ text: x.name, unter: `${x.gut} · Preis: ${x.schlecht}`, tun: () => {
        const vorher = werte().maxLeben;
        s.segen.push(x.key);
        eintrag(`Segen angenommen: ${x.name}.`, "level"); statPlus("segen");
        if (x.key === "opfer") {
          const it = gegenstandBauen(wahl(SLOTS).key, 3, Math.floor(s.raum / 5) + 1);
          if (s.beutel.length < BEUTEL_PLAETZE) { s.beutel.push(it); eintrag(`${it.name} erscheint in deinem Beutel.`, "gold"); }
          statPlus("legendaer");
        }
        const nachher = werte().maxLeben;
        if (nachher < vorher) s.leben = Math.min(s.leben, nachher);
        erfolgePruefen(); aktualisiere(); zeichneInventar(); weiter();
      } })),
      { text: "Ablehnen", unter: "Kein Vorteil, kein Preis", tun: weiter }
    ]
  });
}

function itemDetailsHtml(it, mitVergleich = true) {
  const slot = SLOTS.find((q) => q.key === it.slot);
  const zeilen = [];
  if (it.angriff) zeilen.push(`+${it.angriff} Angriff`);
  if (it.schutz) zeilen.push(`+${it.schutz} Schutz`);
  if (it.element) zeilen.push(`Element: ${elText(it.element)}`);
  it.effekte.forEach((e) => zeilen.push(effektText(e)));
  let setHtml = "";
  if (it.set) {
    const st = SETS[it.set], n = setZaehlen()[it.set] || 0;
    setHtml = `<p class="zeile t-set">Set ${st.name} (${n}/6 angelegt): ${st.boni.map((b, i) => `${(i + 1) * 2} Teile: ${b}`).join(" · ")}</p>`;
  }
  return `<h4 class="t-${it.seltenheit}">${it.name}</h4>
    <div class="zeile">${seltenheitsName(it)} · ${slot.icon} ${slot.name} · Wert ${it.wert} Gold</div>
    <ul>${zeilen.map((z) => `<li>${z}</li>`).join("")}</ul>${setHtml}
    ${mitVergleich ? `<p class="delta">Statt ${s.ausr[it.slot] ? s.ausr[it.slot].name : "nichts"}: ${vergleich(it)}</p>` : ""}`;
}

function fundDialog(it, weiter) {
  ton("beute");
  const voll = s.beutel.length >= BEUTEL_PLAETZE;
  const titel = it.set ? "Ein Set-Teil!" : it.seltenheit === "legendaer" ? "Legendärer Fund!" : it.seltenheit === "episch" ? "Epischer Fund!" : "Beute";
  dialog({
    titel, text: "", html: `<div class="details">${itemDetailsHtml(it)}</div>`,
    knoepfe: [
      { text: "Anlegen", primaer: istBesser(it), tun: () => {
          const alt = s.ausr[it.slot];
          if (alt) { if (voll) eintrag(`${alt.name} zurückgelassen.`); else s.beutel.push(alt); }
          s.ausr[it.slot] = it; s.leben = Math.min(s.leben, werte().maxLeben);
          eintrag(`${it.name} angelegt.`, "gold"); erfolgePruefen(); aktualisiere(); zeichneInventar(); weiter();
        } },
      { text: "In den Beutel", unter: voll ? "Beutel voll" : `${s.beutel.length} / ${BEUTEL_PLAETZE} belegt`, aus: voll, primaer: !istBesser(it) && !voll,
        tun: () => { s.beutel.push(it); eintrag(`${it.name} eingepackt.`); zeichneInventar(); weiter(); } },
      { text: "Liegen lassen", tun: weiter }
    ]
  });
}

function preis(basis) { return Math.round(basis * (1 - 0.03 * skill("feilschen"))); }

function haendler(weiter) {
  const trankPreis = preis(30), trainingPreis = preis(40 + 20 * s.trainings);
  const keineTraenke = hatSegen("alchemist");
  dialog({
    titel: "Ein Händler",
    text: `Im Schein seiner Laterne breitet er seine Waren aus. Du hast ${s.gold} Gold.`,
    html: s.beutel.length ? `<h3 class="titel" style="margin:10px 0 0;font-size:1.1rem">Aus deinem Beutel verkaufen</h3>
      <div class="verkauf">${s.beutel.map((it) => `<button class="knopf klein" type="button" data-verkauf="${it.id}"><span class="t-${it.seltenheit}">${it.name}</span><span>+${it.wert} Gold</span></button>`).join("")}</div>` : "",
    knoepfe: [
      { text: "Trank kaufen", unter: keineTraenke ? "Alchemist: nicht möglich" : s.traenke >= maxTraenke() ? `Gürtel voll (${maxTraenke()})` : `${trankPreis} Gold · ${s.traenke} / ${maxTraenke()}`,
        aus: keineTraenke || s.gold < trankPreis || s.traenke >= maxTraenke(),
        tun: () => { s.gold -= trankPreis; s.traenke += 1; eintrag(`Trank gekauft (−${trankPreis} Gold).`, "heil"); aktualisiere(); zeichneInventar(); haendler(weiter); } },
      { text: "Training: Angriff +2", unter: `${trainingPreis} Gold`, aus: s.gold < trainingPreis,
        tun: () => { s.gold -= trainingPreis; s.angriffBasis += 2; s.trainings += 1; eintrag(`Training: Angriff +2 (−${trainingPreis} Gold).`, "level"); aktualisiere(); zeichneInventar(); haendler(weiter); } },
      { text: "Alle gewöhnlichen verkaufen", unter: (() => { const l = s.beutel.filter((x) => x.seltenheit === "gewoehnlich"); return l.length ? `${l.length} Teile für ${l.reduce((a, x) => a + x.wert, 0)} Gold` : "keine im Beutel"; })(),
        aus: !s.beutel.some((x) => x.seltenheit === "gewoehnlich"),
        tun: () => {
          const l = s.beutel.filter((x) => x.seltenheit === "gewoehnlich");
          const erloes = l.reduce((a, x) => a + x.wert, 0);
          l.forEach((x) => s.beutel.splice(s.beutel.indexOf(x), 1));
          s.gold += erloes; eintrag(`${l.length} gewöhnliche Teile verkauft: +${erloes} Gold.`, "gold");
          erfolgePruefen(); aktualisiere(); zeichneInventar(); haendler(weiter);
        } },
      { text: "Weiterziehen", primaer: true, tun: weiter }
    ]
  });
  $("dialog").querySelectorAll("[data-verkauf]").forEach((b) => b.addEventListener("click", () => {
    const idx = s.beutel.findIndex((x) => x.id === Number(b.dataset.verkauf));
    if (idx < 0) return;
    const it = s.beutel.splice(idx, 1)[0];
    s.gold += it.wert; eintrag(`${it.name} verkauft: +${it.wert} Gold.`, "gold");
    erfolgePruefen(); zeichneInventar(); haendler(weiter);
  }));
}

//   EREIGNISRÄUME
// =====================================================================
const EREIGNISSE = {
  schrein: { bild: "⛩️", titel: "Ein vergessener Schrein", text: "Eine Inschrift verlangt ein Opfer: ein Viertel deines aktuellen Lebens für einen Gegenstand aus der Tiefe." },
  truhe: { bild: "🧰", titel: "Eine verfluchte Truhe", text: "Die Truhe pulsiert. Vielleicht liegt darin ein Schatz, vielleicht wartet etwas Hungriges." },
  brunnen: { bild: "⛲", titel: "Ein klarer Brunnen", text: "Das Wasser leuchtet schwach. Du kannst daraus trinken oder eine Flasche füllen." },
  spieltisch: { bild: "🎲", titel: "Ein Spieltisch", text: "Ein Skelett mit Würfelbecher bietet ein Spiel an: Setze die Hälfte deines Golds. Bei einem Sieg verdoppelt es sich." }
};

function ereignisFertig(text) {
  if (text) eintrag(text);
  statPlus("ereignisse");
  s.ziel = s.raum + 1;
  zumLager(`Raum ${s.raum} hinter dir`, "Bereite dich vor. Im Kampf kostet jeder Ausrüstungswechsel deinen Zug.");
}

function zeichneEreignis(typ) {
  const e = EREIGNISSE[typ];
  eintrag(`Raum ${s.raum}: ${e.titel}`, "raum");
  const w = werte();
  let knoepfe = [];
  if (typ === "schrein") knoepfe = [
    { text: "Opfern", unter: `−${Math.ceil(s.leben / 4)} Leben`, tun: () => {
        const opfer = Math.ceil(s.leben / 4); s.leben = Math.max(s.leben - opfer, 1);
        const it = gegenstandErzeugen(s.raum, "elite");
        eintrag(`Du opferst ${opfer} Leben.`, "schaden");
        fundDialog(it, () => { schliesseDialog(); ereignisFertig(); });
      } },
    { text: "Weitergehen", tun: () => ereignisFertig("Du lässt den Schrein hinter dir.") }];
  if (typ === "truhe") knoepfe = [
    { text: "Öffnen", unter: "Schatz oder Falle", tun: () => {
        if (rnd() < 0.5) {
          const it = gegenstandErzeugen(s.raum, "boss");
          eintrag("Die Truhe enthält einen Schatz!", "gold");
          fundDialog(it, () => { schliesseDialog(); ereignisFertig(); });
        } else {
          eintrag("Die Truhe hat Zähne!", "schaden");
          const g = gegnerErzeugen(Math.max(s.raum, 9));
          const mimik = { ...g, ereignis: null, name: "Mimik (Zäh)", art: "Mimik", mechanik: null, bild: "📦", schwach: "feuer", stark: "blitz", element: null, boss: false, elite: "zaeh", stufe: 0, spezial: 0,
            leben: Math.round((22 + 7 * s.raum) * 1.8), schaden: Math.round(4 + 2 * s.raum), exp: 25 * s.raum, gold: 3 * s.raum };
          s.naechster = mimik; s.ziel = s.raum; betreteRaum();
        }
      } },
    { text: "Ignorieren", tun: () => ereignisFertig("Du lässt die Truhe zu.") }];
  if (typ === "brunnen") knoepfe = [
    { text: "Trinken", unter: "Leben voll auffüllen", tun: () => { s.leben = w.maxLeben; ereignisFertig("Du trinkst und fühlst dich erfrischt."); } },
    { text: "Flasche füllen", unter: hatSegen("alchemist") ? "Alchemist: nicht möglich" : s.traenke >= maxTraenke() ? "Gürtel voll" : "+1 Trank",
      aus: hatSegen("alchemist") || s.traenke >= maxTraenke(), tun: () => { s.traenke += 1; ereignisFertig("Du füllst eine Flasche: +1 Trank."); } }];
  if (typ === "spieltisch") knoepfe = [
    { text: "Spielen", unter: `Einsatz ${Math.floor(s.gold / 2)} Gold`, aus: s.gold < 2, tun: () => {
        const einsatz = Math.floor(s.gold / 2);
        if (rnd() < 0.5) { s.gold += einsatz; statPlus("gold", einsatz); ereignisFertig(`Gewonnen! +${einsatz} Gold.`); }
        else { s.gold -= einsatz; ereignisFertig(`Verloren. −${einsatz} Gold.`); }
      } },
    { text: "Ablehnen", tun: () => ereignisFertig("Das Skelett klappert enttäuscht.") }];

  $("arena").innerHTML = `
    <section class="ereignis">
      <div class="siegel erscheinen">${e.bild}</div>
      <h2 class="titel">${e.titel}</h2>
      <p>${e.text}</p>
    </section>
    ${spielerHtml()}
    <section class="aktionen zwei" id="ereignisKnoepfe"></section>`;
  const box = $("ereignisKnoepfe");
  knoepfe.forEach((k, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "knopf" + (i === 0 ? " angriff" : "");
    b.innerHTML = `<span>${k.text}${k.unter ? `<span class="unter">${k.unter}</span>` : ""}</span><kbd>${i + 1}</kbd>`;
    b.disabled = !!k.aus;
    b.addEventListener("click", () => { if (s.phase === "ereignis") k.tun(); });
    box.appendChild(b);
  });
  spielerWerteAnzeigen();
  $("ort").innerHTML = `Raum <b>${s.raum}</b> · Bosse <b>${s.bosse}</b>`;
}

// =====================================================================
//   SPIELENDE
// =====================================================================
function splitterBerechnen() {
  const basis = s.raum + 10 * s.bosse + 3 * s.elite;
  return Math.round(basis * (1 + 0.25 * s.fluch) * (hatSegen("seelenernte") ? 1.75 : 1));
}

function spielende(ergebnis) {
  schliesseDialog();
  s.phase = "ende";
  laufLoeschen();
  ton(ergebnis === "Niederlage" ? "niederlage" : "sieg");
  statPlus("laeufe");
  const splitter = splitterBerechnen();
  meta.splitter += splitter;
  const neuerRekord = s.raum > meta.rekord;
  if (neuerRekord) meta.rekord = s.raum;
  let fluchFrei = false;
  if (!s.tages && s.bosse >= 2 && s.fluch === meta.fluchMax && meta.fluchMax < MAX_FLUCH) { meta.fluchMax += 1; fluchFrei = true; }
  if (s.tages) { const k = tagesSchluessel(); meta.tagesBest[k] = Math.max(meta.tagesBest[k] || 0, s.raum); }
  metaSpeichern();

  const texte = {
    "Sieg": ["🏆", "Mit Ruhm heimgekehrt", "Du verlässt den Dungeon lebend und mit vollen Taschen."],
    "Niederlage": ["🪦", "Gefallen", "Der Dungeon behält dich, aber deine Seele bringt Splitter zurück."],
    "Geflohen": ["🏃", "Geflohen", "Du rennst ans Tageslicht. Lebend, aber ohne Ruhm."]
  };
  const [bild, titel, text] = texte[ergebnis];
  eintrag(`Spielende: ${ergebnis}. +${splitter} Seelensplitter.`, "raum");
  const w = werte();
  $("arena").innerHTML = `<section class="buehne-voll">
      <div class="siegel erscheinen">${bild}</div>
      <h2 class="titel">${titel}</h2><p>${text}</p>
      <p class="belohnung-splitter">+<b>${splitter}</b> Seelensplitter</p>
      <div class="statistik">
        <div><small>Erreichter Raum</small><b>${s.raum}</b></div>
        <div><small>Bosse</small><b>${s.bosse}</b></div>
        <div><small>Elite</small><b>${s.elite}</b></div>
        <div><small>Level</small><b>${s.level}</b></div>
        <div><small>Angriff</small><b>${w.angriff}</b></div>
        <div><small>Schutz</small><b>${w.schutz}</b></div>
      </div>
      ${neuerRekord ? `<p class="rekord">Neuer Rekord: Raum ${s.raum}</p>` : ""}
      ${fluchFrei ? `<p class="rekord">Fluchstufe ${meta.fluchMax} freigeschaltet</p>` : ""}
      ${ranglisteAn() ? `<form class="eintragen" id="eintragenForm">
        <label for="spielerName">Name für die ${s.tages ? "Tages-" : ""}Rangliste</label>
        <div><input id="spielerName" maxlength="20" autocomplete="nickname" value="${esc(meta.name)}" placeholder="Dein Name" required>
        <button class="knopf primaer klein" type="submit">Eintragen</button></div>
        <small id="eintragenStatus"></small></form>` : ""}
      <button class="knopf angriff" id="hubKnopf" type="button">Zurück ins Lager der Ahnen</button>
    </section>`;
  $("ort").innerHTML = "";
  $("inventar").hidden = true;
  const form = $("eintragenForm");
  if (form) {
    const lauf = { modus: s.tages ? "tag" : "normal", tag: s.tages ? tagesSchluessel() : null, raum: s.raum, bosse: s.bosse, level: s.level, klasse: s.klasse, fluch: s.fluch, ergebnis };
    form.addEventListener("submit", (e) => { e.preventDefault(); laufEintragen(lauf, form); });
  }
  $("hubKnopf").addEventListener("click", () => { s = null; hubReiter = "baum"; zeichneHub(); });
  $("hubKnopf").focus();
}

// =====================================================================
//   RANGLISTE (Supabase)
// =====================================================================
const ranglisteAn = () => Boolean(SUPABASE_URL && SUPABASE_KEY);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function spielerId() {
  if (!meta.spielerId) {
    // randomUUID gibt es nur über https, getRandomValues überall
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    meta.spielerId = `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    metaSpeichern();
  }
  return meta.spielerId;
}
async function supabase(pfad, optionen = {}) {
  const kopf = { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...optionen.headers };
  // Alte anon keys sind JWTs und gehören zusätzlich in den Authorization-Header
  if (SUPABASE_KEY.startsWith("eyJ")) kopf.Authorization = `Bearer ${SUPABASE_KEY}`;
  const antwort = await fetch(`${SUPABASE_URL.replace(/\/$/, "")}/rest/v1/${pfad}`, { ...optionen, headers: kopf });
  if (!antwort.ok) throw new Error(`Supabase ${antwort.status}`);
  return antwort;
}
function ranglistePfad(modus) {
  return modus === "tag"
    ? `rangliste_tag?tag=eq.${encodeURIComponent(tagesSchluessel())}`
    : "rangliste_allzeit?";
}
async function ranglisteLaden(modus) {
  const antwort = await supabase(`${ranglistePfad(modus)}&select=*&order=raum.desc,bosse.desc,erstellt.asc&limit=25`);
  return antwort.json();
}
async function platzErmitteln(modus, raum) {
  const antwort = await supabase(`${ranglistePfad(modus)}&select=spieler_id&raum=gt.${raum}&spieler_id=neq.${spielerId()}&limit=1`, { headers: { Prefer: "count=exact" } });
  const gesamt = Number((antwort.headers.get("Content-Range") || "").split("/")[1]);
  return Number.isFinite(gesamt) ? gesamt + 1 : null;
}
async function laufEintragen(lauf, form) {
  const name = $("spielerName").value.trim().slice(0, 20);
  const status = $("eintragenStatus");
  if (!name) return;
  meta.name = name; metaSpeichern();
  form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
  status.textContent = "Wird eingetragen …";
  try {
    await supabase("laeufe", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ ...lauf, name, spieler_id: spielerId() }) });
    const platz = await platzErmitteln(lauf.modus, lauf.raum).catch(() => null);
    status.textContent = platz ? `Eingetragen. Aktuell Platz ${platz} ${lauf.modus === "tag" ? "im heutigen Tages-Dungeon" : "in der Allzeit-Liste"}.` : "Eingetragen.";
    ranglisteModus = lauf.modus === "tag" ? "tag" : "allzeit";
  } catch (e) {
    status.textContent = "Eintragen fehlgeschlagen. Prüfe deine Verbindung.";
    form.querySelectorAll("input, button").forEach((el) => (el.disabled = false));
  }
}
function ranglisteHtml() {
  if (!ranglisteAn()) return `<p class="fluch-text" style="text-align:center">Die Rangliste ist noch nicht eingerichtet.</p>`;
  return `<div class="reiter unter-reiter">
      <button type="button" data-rmodus="tag" aria-pressed="${ranglisteModus === "tag"}">Tages-Dungeon heute</button>
      <button type="button" data-rmodus="allzeit" aria-pressed="${ranglisteModus === "allzeit"}">Allzeit</button>
    </div>
    <p class="fluch-text" style="text-align:center;margin-bottom:10px">${ranglisteModus === "tag"
      ? "Bester Lauf je Spieler im heutigen Tages-Dungeon. Für alle gleich: Krieger, ohne Fluch, ohne Skills."
      : "Bester Lauf je Spieler über alle Läufe. Skills und Fluchstufe zählen mit."}</p>
    <div id="ranglisteInhalt"><p class="fluch-text" style="text-align:center">Lädt …</p></div>`;
}
async function ranglisteFuellen() {
  const ziel = $("ranglisteInhalt");
  if (!ziel) return;
  const modus = ranglisteModus;
  try {
    const zeilen = await ranglisteLaden(modus);
    if (!$("ranglisteInhalt") || modus !== ranglisteModus) return;
    const ich = meta.spielerId;
    $("ranglisteInhalt").innerHTML = zeilen.length ? `<ol class="rangliste">${zeilen.map((z, i) => `
      <li class="${z.spieler_id === ich ? "ich" : ""}"><span class="platz">${i + 1}</span>
        <span class="wer"><b>${esc(z.name)}</b><small>${modus === "tag" ? `Level ${z.level}` : `${esc(KLASSEN.find((k) => k.key === z.klasse)?.name || z.klasse)} · Level ${z.level}${z.fluch ? ` · Fluch ${z.fluch}` : ""}`} · ${z.bosse} ${z.bosse === 1 ? "Boss" : "Bosse"}</small></span>
        <span class="raum">Raum <b>${z.raum}</b></span></li>`).join("")}</ol>`
      : `<p class="fluch-text" style="text-align:center">${modus === "tag" ? "Heute hat sich noch niemand eingetragen. Sei die erste Person!" : "Noch keine Einträge."}</p>`;
  } catch (e) {
    if ($("ranglisteInhalt")) $("ranglisteInhalt").innerHTML = `<p class="fluch-text" style="text-align:center">Rangliste konnte nicht geladen werden.</p>`;
  }
}

function bestiariumHtml() {
  const karte = (x, boss) => {
    const n = meta.bestiarium[x.name] || 0;
    if (!n) return `<div class="karte gesperrt"><span class="gross">❔</span><b>???</b><small>${boss ? `Boss ab Stufe ${x.ab}` : `ab Raum ${x.ab}`}</small></div>`;
    const m = boss ? MECHANIKEN[BOSS_MECHANIK[x.name]] : null;
    return `<div class="karte"><span class="gross">${x.bild}</span><b>${x.name}</b>
      <small>Schwach: ${elText(x.schwach)}${x.stark ? ` · Stark: ${elText(x.stark)}` : ""}${x.element ? ` · Angriff: ${elText(x.element)}` : ""}</small>
      ${m ? `<small><b>${m.name}:</b> ${m.text}</small>` : ""}<small>${n}× besiegt</small></div>`;
  };
  const bekannt = [...GEGNER, ...BOSSE].filter((x) => meta.bestiarium[x.name]).length;
  return `<p class="fluch-text" style="text-align:center;margin-bottom:10px">${bekannt} von ${GEGNER.length + BOSSE.length} Gegnern entdeckt</p>
    <h3 class="titel abschnitt-titel">Monster</h3><div class="karten">${GEGNER.map((x) => karte(x, false)).join("")}</div>
    <h3 class="titel abschnitt-titel">Bosse</h3><div class="karten">${BOSSE.map((x) => karte(x, true)).join("")}</div>`;
}

  $("ort").innerHTML = `Läufe <b>${meta.laeufe}</b> · Rekord <b>Raum ${meta.rekord}</b>`;
  if (!meta.klassen[hubKlasse]) hubKlasse = "krieger";
  hubFluch = Math.min(hubFluch, meta.fluchMax);

  if (hubReiter === "lauf") {
    const gespeichert = laufLaden();
    inhalt = `
      ${gespeichert ? `<div class="fortsetzen"><div><b>Laufender Lauf</b><small>${KLASSEN.find((k) => k.key === gespeichert.s.klasse).name}${gespeichert.s.tages ? " · Tages-Dungeon" : ""} · vor Raum ${gespeichert.s.ziel} · Level ${gespeichert.s.level}</small></div>

      ${SKILLS.filter((k) => k.ast === ast).map((k) => {
        const st = skill(k.id), voll = st >= k.max, kosten = k.kosten(st);
        const gesperrt = k.schluessel && astPunkte(ast) < k.braucht;
        const kann = !voll && !gesperrt && meta.splitter >= kosten;
        return `<div class="knoten ${k.schluessel ? "schluessel" : ""}">
          <b>${k.name}</b><small>${k.schluessel ? k.text(1) : st === 0 ? `Nächste Stufe: ${k.text(1)}` : voll ? `Aktiv: ${k.text(st)}` : `Aktiv: ${k.text(st)} · nächste: ${k.text(st + 1)}`}</small>

  $("arena").querySelectorAll("[data-reiter]").forEach((b) => b.addEventListener("click", () => { hubReiter = b.dataset.reiter; zeichneHub(); }));
  $("arena").querySelectorAll("[data-klasse]").forEach((b) => b.addEventListener("click", () => {
    const k = KLASSEN.find((x) => x.key === b.dataset.klasse);

  if (hubReiter === "rangliste") ranglisteFuellen();
  $("arena").querySelectorAll("[data-fluch]").forEach((b) => b.addEventListener("click", () => { hubFluch = Number(b.dataset.fluch); zeichneHub(); }));
  $("arena").querySelectorAll("[data-skill]").forEach((b) => b.addEventListener("click", () => {

  const start = $("startKnopf");

  }));
  const tagesKnopf = $("tagesKnopf"); if (tagesKnopf) tagesKnopf.addEventListener("click", () => laufStarten("krieger", 0, true));
  const resetKnopf = $("resetKnopf"); if (resetKnopf) resetKnopf.addEventListener("click", () => dialog({
    titel: "Wirklich alles zurücksetzen?", text: "Seelensplitter, Skills, Klassen, Fluchstufen, Erfolge, Bestiarium und ein gespeicherter Lauf werden gelöscht. Das lässt sich nicht rückgängig machen.",

function feldHtml(it, attr, gewaehlt, besser = false) {
  const slot = SLOTS.find((q) => q.key === it.slot);
  return `<button type="button" class="feld s-${it.seltenheit}${gewaehlt ? " gewaehlt" : ""}${besser ? " besser" : ""}" ${attr}>
    <span class="art">${slot.icon} ${slot.name}</span><span class="nm t-${it.seltenheit}">${it.name}</span><span class="st">${kurzwert(it)}</span></button>`;
}

const RANG = { gewoehnlich: 0, selten: 1, episch: 2, set: 3, legendaer: 4 };
function beutelSortiert() {
  const liste = [...s.beutel];
  const art = s.sortierung || "neu";
  const slotNr = (it) => SLOTS.findIndex((q) => q.key === it.slot);
  if (art === "neu") liste.reverse();
  if (art === "platz") liste.sort((a, b) => slotNr(a) - slotNr(b) || RANG[b.seltenheit] - RANG[a.seltenheit]);
  if (art === "seltenheit") liste.sort((a, b) => RANG[b.seltenheit] - RANG[a.seltenheit] || slotNr(a) - slotNr(b));
  if (art === "besser") liste.sort((a, b) => Number(istBesser(b)) - Number(istBesser(a)) || RANG[b.seltenheit] - RANG[a.seltenheit]);
  return liste;
}
