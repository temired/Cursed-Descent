  });
}

// ---------- Schmied ----------
function alleGegenstaende() { return [...SLOTS.map((sl) => s.ausr[sl.key]).filter(Boolean), ...s.beutel]; }
function verbessernKosten(it) { return Math.round((20 + 15 * it.stufe) * (1 + (it.plus || 0))); }
function umschmiedenKosten(it) { return 30 + 20 * it.stufe; }

function schmied(weiter) {
  const liste = alleGegenstaende();
  dialog({
    titel: "Ein Schmied",
    text: `Funken sprühen vom Amboss. Du hast ${s.gold} Gold. Welchen Gegenstand soll er bearbeiten?`,
    html: `<div class="verkauf">${liste.map((it) => `<button class="knopf klein" type="button" data-schmied="${it.id}"><span class="t-${it.seltenheit}">${it.name}</span><span>${kurzwert(it)}</span></button>`).join("")}</div>`,
    knoepfe: [{ text: "Weiterziehen", primaer: true, tun: weiter }]
  });
  $("dialog").querySelectorAll("[data-schmied]").forEach((b) => b.addEventListener("click", () => schmiedGegenstand(Number(b.dataset.schmied), weiter)));
}

function schmiedGegenstand(id, weiter) {
  const it = alleGegenstaende().find((x) => x.id === id);
  if (!it) { schmied(weiter); return; }
  const kv = verbessernKosten(it), ku = umschmiedenKosten(it), plus = it.plus || 0;
  const umschmiedbar = it.effekte.length > (it.set ? 1 : 0);
  dialog({
    titel: "Am Amboss", text: `Du hast ${s.gold} Gold.`, html: `<div class="details">${itemDetailsHtml(it, false)}</div>`,
    knoepfe: [
      { text: `Verbessern auf +${plus + 1}`, unter: plus >= 5 ? "Maximum erreicht" : `${kv} Gold · alle Werte steigen um etwa 15 %`, primaer: true,
        aus: plus >= 5 || s.gold < kv,
        tun: () => { s.gold -= kv; verbessern(it); eintrag(`${it.name} geschmiedet (−${kv} Gold).`, "gold"); ton("beute"); nachSchmiede(); schmiedGegenstand(id, weiter); } },
      { text: "Effekte neu schmieden", unter: umschmiedbar ? `${ku} Gold · neue zufällige Effekte` : "keine Effekte zum Umschmieden",
        aus: !umschmiedbar || s.gold < ku,
        tun: () => { s.gold -= ku; umschmieden(it); eintrag(`${it.name} neu geschmiedet (−${ku} Gold).`, "gold"); nachSchmiede(); schmiedGegenstand(id, weiter); } },
      { text: "Anderen Gegenstand wählen", tun: () => schmied(weiter) }
    ]
  });
}
function nachSchmiede() { s.leben = Math.min(s.leben, werte().maxLeben); aktualisiere(); zeichneInventar(); }

function verbessern(it) {
  it.basisName = it.basisName || it.name;
  it.plus = (it.plus || 0) + 1;
  it.name = `${it.basisName} +${it.plus}`;
  if (it.angriff) it.angriff = Math.max(it.angriff + 1, Math.round(it.angriff * 1.15));
  if (it.schutz) it.schutz = Math.max(it.schutz + 1, Math.round(it.schutz * 1.15));
  it.effekte.forEach((e) => { if (e.typ !== "block") e.wert = Math.max(e.wert + 1, Math.round(e.wert * 1.1)); });
  it.wert = Math.round(it.wert * 1.2);
}

function umschmieden(it) {
  const fest = it.set ? it.effekte[0] : null;
  const anzahl = it.effekte.length - (fest ? 1 : 0);
  const pool = EFFEKT_POOL[it.slot].filter((t) => !fest || t !== fest.typ);
  const neu = [];
  for (let i = 0; i < anzahl && pool.length; i++) neu.push(effektErzeugen(pool.splice(zufall(0, pool.length - 1), 1)[0], it.stufe + (it.plus || 0)));
  it.effekte = fest ? [fest, ...neu] : neu;
}

// ---------- Töne ----------
let audio = null;
function tonAn() { try { return localStorage.getItem("miniDungeonTon") !== "aus"; } catch (e) { return true; } }
function ton(art) {
  if (!tonAn()) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const folgen = { treffer: [[220, 0.06]], krit: [[330, 0.05], [523, 0.09]], schaden: [[110, 0.08]], level: [[392, 0.08], [523, 0.08], [659, 0.15]],
      beute: [[523, 0.07], [784, 0.12]], sieg: [[294, 0.07], [392, 0.1]], niederlage: [[196, 0.15], [147, 0.3]] }[art];
    if (!folgen) return;
    let t = audio.currentTime;
    folgen.forEach(([f, d]) => {
      const o = audio.createOscillator(), gain = audio.createGain();
      o.type = art === "schaden" || art === "niederlage" ? "sawtooth" : "triangle";
      o.frequency.value = f;
      gain.gain.setValueAtTime(0.07, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(gain); gain.connect(audio.destination);
      o.start(t); o.stop(t + d + 0.02); t += d;
    });
  } catch (e) {}
}
function tonKnopfAktualisieren() { $("tonKnopf").textContent = tonAn() ? "Ton an" : "Ton aus"; }

function zeichneInventar() {
  if (!s || s.phase === "ende") return;
  const w = werte(), a = s.auswahl;
  const slotsHtml = SLOTS.map((sl) => {
    const it = s.ausr[sl.key];
    return it ? feldHtml(it, `data-slot="${sl.key}"`, a && a.ort === "slot" && a.slot === sl.key)
      : `<div class="feld leer"><span>${sl.icon}</span><span class="art">${sl.name}</span></div>`;
  }).join("");
  const beutelHtml = beutelSortiert().map((it) => feldHtml(it, `data-id="${it.id}"`, a && a.ort === "beutel" && a.id === it.id, istBesser(it))).join("")
    + Array.from({ length: BEUTEL_PLAETZE - s.beutel.length }, () => `<div class="feld leer"></div>`).join("");

  let details = `<p class="leer-hinweis">Wähle einen Gegenstand, um ihn anzusehen und anzulegen. ▲ markiert Teile, die besser sind als deine aktuelle Ausrüstung.</p>`;
  const kosten = s.phase === "kampf" ? " (kostet deinen Zug)" : "";
  const gesperrt = beschaeftigt || (s.phase !== "kampf" && s.phase !== "lager" && s.phase !== "ereignis");
  if (a && a.ort === "beutel") {
    const it = s.beutel.find((x) => x.id === a.id);
    if (it) details = `<div class="details">${itemDetailsHtml(it)}<div class="knoepfe">
        <button class="knopf klein primaer" type="button" data-tun="anlegen" ${gesperrt ? "disabled" : ""}>Anlegen${kosten}</button>
        <button class="knopf klein" type="button" data-tun="wegwerfen" ${s.phase === "kampf" ? "disabled" : ""}>Wegwerfen</button></div></div>`;
  } else if (a && a.ort === "slot" && s.ausr[a.slot]) {
    details = `<div class="details">${itemDetailsHtml(s.ausr[a.slot], false)}<div class="knoepfe">
        <button class="knopf klein" type="button" data-tun="ablegen" ${gesperrt ? "disabled" : ""}>Ablegen${kosten}</button></div></div>`;
  }

  const res = ELEMENT_KEYS.filter((k) => w.res[k]).map((k) => `${ELEMENTE[k].icon} ${w.res[k]} %`).join(", ");
  const sets = Object.entries(w.z).map(([key, n]) => {
    const st = SETS[key], aktiv = st.boni.slice(0, Math.floor(n / 2));
    return `<button type="button" class="chip" data-set="${key}">${st.name} ${n}/6${aktiv.length ? ` · ${aktiv.length} ${aktiv.length > 1 ? "Boni" : "Bonus"} aktiv` : ""} · Details</button>`;
  }).join("");

  $("inventar").innerHTML = `
    <div class="inv-kopf"><h2 class="titel">Ausrüstung</h2><span>${s.phase === "kampf" ? "Wechsel im Kampf kostet deinen Zug" : "Umrüsten ist außerhalb des Kampfes kostenlos"}</span></div>
    <div class="slots">${slotsHtml}</div>
    <div class="kampfwerte">
      <span>Element <b>${w.element ? elText(w.element) : "keins"}</b></span>
      <span>Lebensraub <b>${w.lebensraub} %</b></span><span>Block <b>${w.block} %</b></span><span>Dornen <b>${w.dornen}</b></span>
      <span>Resistenzen <b>${res || "keine"}</b></span>
    </div>
    ${sets ? `<div class="set-liste">${sets}</div>` : ""}
    <div class="unterkopf"><h3 class="titel">Beutel<span>${s.beutel.length} / ${BEUTEL_PLAETZE}</span></h3><div class="sortierung">${[["neu", "Neueste"], ["platz", "Platz"], ["seltenheit", "Seltenheit"], ["besser", "Besser zuerst"]].map(([k, t]) => `<button type="button" data-sort="${k}" aria-pressed="${(s.sortierung || "neu") === k}">${t}</button>`).join("")}</div></div>
    <div class="beutel">${beutelHtml}</div>
    ${details}`;

  $("inventar").querySelectorAll("[data-slot]").forEach((b) => b.addEventListener("click", () => { s.auswahl = { ort: "slot", slot: b.dataset.slot }; zeichneInventar(); }));
  $("inventar").querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", () => { s.auswahl = { ort: "beutel", id: Number(b.dataset.id) }; zeichneInventar(); }));
  $("inventar").querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => setDialog(b.dataset.set)));
  $("inventar").querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => { s.sortierung = b.dataset.sort; zeichneInventar(); }));
  const tun = (name, f) => { const b = $("inventar").querySelector(`[data-tun="${name}"]`); if (b) b.addEventListener("click", f); };
  tun("anlegen", () => anlegen(a.id));
  tun("wegwerfen", () => wegwerfen(a.id));
  tun("ablegen", () => ablegen(a.slot));
}

// =====================================================================
//   HILFEN
// =====================================================================
function eintrag(text, art = "") {
  const li = document.createElement("li");
  li.textContent = text; if (art) li.className = art;
  const ol = $("chronik"); ol.prepend(li);
  while (ol.children.length > 90) ol.lastChild.remove();
}
function zahl(ziel, text, art) {
  if (!ziel) return;
  const r = ziel.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "zahl " + art; el.textContent = text;
  el.style.left = r.left + r.width / 2 + Math.round(Math.random() * 48 - 24) + "px"; el.style.top = r.top - 4 + "px";
  document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}
function wackle(el) { if (!el) return; el.classList.remove("wackeln", "erscheinen"); void el.offsetWidth; el.classList.add("wackeln"); }
let hinweisTimer;
function hinweis(text) { const h = $("hinweis"); h.textContent = text; h.classList.add("an"); clearTimeout(hinweisTimer); hinweisTimer = setTimeout(() => h.classList.remove("an"), 2200); }

function dialog({ titel, text, html = "", knoepfe }) {
  const d = $("dialog");
  d.innerHTML = `<h2 class="titel">${titel}</h2>${text ? `<p>${text}</p>` : ""}${html}<div class="knoepfe"></div>`;
  const box = d.querySelector(".knoepfe");
  knoepfe.forEach((k, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "knopf" + (k.primaer ? " primaer" : "");
    b.innerHTML = `<span>${k.text}${k.unter ? `<span class="unter">${k.unter}</span>` : ""}</span><kbd>${i + 1}</kbd>`;
    b.disabled = !!k.aus; b.addEventListener("click", () => k.tun());
    box.appendChild(b);
  });
  $("schleier").classList.add("offen");
  const erster = box.querySelector(".primaer:not(:disabled)") || box.querySelector("button:not(:disabled)");
  if (erster) erster.focus();
}
function schliesseDialog() { $("schleier").classList.remove("offen"); }

document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input")) return;
  const nr = parseInt(e.key, 10);
  if ($("schleier").classList.contains("offen")) {
    const k = $("dialog").querySelectorAll(".knoepfe button");
    if (nr >= 1 && nr <= k.length && !k[nr - 1].disabled) { e.preventDefault(); k[nr - 1].click(); }
    return;
  }
  if (!s) { const ziel = $("weiterLauf") || $("startKnopf"); if (e.key === "1" && ziel) { e.preventDefault(); ziel.click(); } return; }
  if (s.phase === "lager") {
    if (e.key === "1") { e.preventDefault(); betreteRaum(); }
    if (e.key === "2") { e.preventDefault(); lagerTrank(); }
    return;
  }
  if (s.phase === "ereignis") {
    const k = $("ereignisKnoepfe") ? $("ereignisKnoepfe").querySelectorAll("button") : [];
    if (nr >= 1 && nr <= k.length && !k[nr - 1].disabled) { e.preventDefault(); k[nr - 1].click(); }
    return;
  }
  if (s.phase !== "kampf") return;
  const typ = { 1: "angriff", 2: "trank", 3: "flucht", a: "angriff", t: "trank", f: "flucht" }[e.key.toLowerCase()];
  if (typ) { e.preventDefault(); aktion(typ); }
});

$("themaKnopf").addEventListener("click", () => {
  const r = document.documentElement;
  const dunkel = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dunkel ? "light" : "dark";
  try { localStorage.setItem("miniDungeonThema", r.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("miniDungeonThema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

$("tonKnopf").addEventListener("click", () => {
  try { localStorage.setItem("miniDungeonTon", tonAn() ? "aus" : "an"); } catch (e) {}
  tonKnopfAktualisieren();
});
tonKnopfAktualisieren();

meta = metaLaden();
zeichneHub();

</script>
